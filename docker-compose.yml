services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashes-of-microgravity
    image: ashes-of-microgravity:latest
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./ai/chroma_db:/app/ai/chroma_db
      - ./ai/papers:/app/ai/papers:ro